Name: Hisap Kitap
Summary: Shop ledger and billing app for small businesses
Description: |-
  Hisap Kitap is a comprehensive shop ledger and billing app designed for small 
  business owners. It helps track stock, sales, investments, customer dues, 
  payments, invoices, and generate daily reports - all from one app.
  
  Features:
  - Product stock-in and sale-out entries
  - Investment and expense tracking
  - Customer ledger with credit and payment records
  - Cash, card, and UPI payment method tracking
  - Invoice creation, PDF printing, and WhatsApp sharing
  - UPI QR code support
  - Low-stock alerts
  - Daily and monthly reports
  - Local data storage
  - Multi-language support

